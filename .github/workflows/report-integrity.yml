name: Customer reporting regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/report-integrity]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate customer reporting and sync
        working-directory: outreach-dashboard
        run: npm run check
