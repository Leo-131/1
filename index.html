<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flextail Outreach Dashboard v0.1.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --primary: #4ade80; --accent: #3b82f6; --warning: #f59e0b; --bg: #0f1117; --card: #1a1d27; --border: #2a2f3e; --text: #e4e8f0; --muted: #7a8299; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
.container { max-width: 1600px; margin: 0 auto; }

/* Header */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 24px; font-weight: 700; }
.header .meta { text-align: right; font-size: 13px; color: var(--muted); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.badge-live { background: #16a34a22; color: var(--primary); border: 1px solid #16a34a44; }
.badge-v { background: #3b82f622; color: var(--accent); border: 1px solid #3b82f644; margin-left: 8px; }

/* Panel System */
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 16px; margin-bottom: 20px; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.3s; position: relative; }
.panel:hover { border-color: #3b82f644; }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: move; background: #141720; }
.panel-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel-header .icon { font-size: 18px; }
.panel-tools { display: flex; gap: 6px; }
.panel-tools button { width: 24px; height: 24px; border: none; background: var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.panel-tools button:hover { background: var(--accent); color: #fff; }
.panel-body { padding: 16px 18px; max-height: 500px; overflow-y: auto; }
.panel.collapsed .panel-body { display: none; }

/* Progress Ring */
.progress-ring { display: flex; align-items: center; justify-content: center; padding: 20px; }
.ring-container { position: relative; width: 140px; height: 140px; }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
.ring-fill { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 0.5s; }
.ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
.ring-text .num { font-size: 36px; font-weight: 700; color: var(--text); }
.ring-text .unit { font-size: 14px; color: var(--muted); }
.progress-stats { display: flex; gap: 24px; margin-top: 16px; justify-content: center; }
.stat-item { text-align: center; }
.stat-item .val { font-size: 20px; font-weight: 700; }
.stat-item .lbl { font-size: 11px; color: var(--muted); }
.stat-item.done .val { color: var(--primary); }
.stat-item.todo .val { color: var(--warning); }

/* Platform Cards */
.platform-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.platform-card { background: #141720; border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.2s; }
.platform-card:hover { border-color: var(--accent); }
.platform-card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.platform-card .icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.platform-card .icon.li { background: #0a66c222; color: #0a66c2; }
.platform-card .icon.fb { background: #1877f222; color: #1877f2; }
.platform-card .icon.ig { background: #e4405f22; color: #e4405f; }
.platform-card .icon.em { background: #6b728022; color: #6b7280; }
.platform-card .num { font-size: 18px; font-weight: 700; }
.platform-card .lbl { font-size: 11px; color: var(--muted); }
.platform-card .bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.platform-card .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.platform-card .bar-fill.li { background: #0a66c2; }
.platform-card .bar-fill.fb { background: #1877f2; }
.platform-card .bar-fill.ig { background: #e4405f; }
.platform-card .bar-fill.em { background: #6b7280; }
.platform-card .status { font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-left: 8px; }
.platform-card .status.active { background: #22c55e22; color: #22c55e; }

/* Contact List */
.contact-list { max-height: 320px; overflow-y: auto; }
.contact-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #141720; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
.contact-item:hover { border-color: var(--accent); }
.contact-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: var(--primary); }
.contact-item .info { flex: 1; }
.contact-item .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.contact-item .name .tag { font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--warning); color: #000; font-weight: 700; }
.contact-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.contact-item .right { text-align: right; }
.contact-item .platform { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.contact-item .status { font-size: 12px; font-weight: 600; }
.contact-item .status.sent { color: var(--primary); }
.contact-item .status.pending { color: var(--warning); }
.contact-item .status.scheduled { color: var(--accent); }

/* Filter Tabs */
.filter-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-tab { padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.filter-tab:hover { border-color: var(--muted); }
.filter-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Timezone Bar */
.tz-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.tz-item { background: #141720; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
.tz-item .flag { font-size: 18px; }
.tz-item .name { color: var(--muted); font-size: 11px; }
.tz-item .time { color: var(--text); font-weight: 600; }
.tz-item .status { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.tz-item .status.working { background: #22c55e22; color: #22c55e; }
.tz-item .status.off { background: #4b556322; color: #6b7280; }

/* Keywords */
.kw-list { display: flex; flex-wrap: wrap; gap: 8px; }
.kw-tag { padding: 6px 12px; background: #141720; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.kw-tag:hover { border-color: var(--accent); background: #1e2a3a; }
.kw-tag .score { font-size: 10px; padding: 2px 5px; border-radius: 3px; background: var(--warning); color: #000; font-weight: 600; }

/* Log */
.log-list { max-height: 200px; overflow-y: auto; }
.log-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.log-item:last-child { border-bottom: none; }
.log-item .time { color: var(--muted); min-width: 45px; }
.log-item .msg { color: var(--text); }
.log-item .msg.success { color: var(--primary); }
.log-item .msg.warn { color: var(--warning); }

/* Changelog */
.changelog-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
.changelog-section h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.version-item { background: #141720; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.version-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; transition: background 0.2s; }
.version-header:hover { background: #1e2a3a; }
.version-header .v-num { font-weight: 600; font-size: 14px; }
.version-header .v-date { font-size: 12px; color: var(--muted); }
.version-body { padding: 0 16px 12px; display: none; }
.version-item.expanded .version-body { display: block; }
.version-body ul { list-style: none; font-size: 13px; }
.version-body li { padding: 6px 0; padding-left: 20px; position: relative; }
.version-body li::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; }
.version-body li.add::before { background: var(--primary); }
.version-body li.improve::before { background: var(--accent); }
.version-body li.fix::before { background: var(--warning); }
.version-body li.keep::before { background: var(--muted); }

/* Drag & Resize */
.panel.dragging { opacity: 0.7; transform: scale(1.02); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.panel.resizing { border-color: var(--accent); }
.resize-handle { position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: se-resize; opacity: 0; transition: opacity 0.2s; }
.panel:hover .resize-handle { opacity: 0.5; }
.resize-handle::after { content: ''; position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
.toast.show { opacity: 1; }
.toast.success { border-color: var(--primary); color: var(--primary); }

/* Responsive */
@media (max-width: 1200px) { .panels { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
@media (max-width: 768px) { .panels { grid-template-columns: 1fr; } .platform-grid { grid-template-columns: 1fr; } }
</style>

// Progress Ring

  ring.style.strokeDashoffset=circumference*(1-current/total);
  document.getElementById('progressNum').textContent=current;
  document.getElementById('doneNum').textContent=current;
  document.getElementById('todoNum').textContent=total-current;
}
updateProgressRing(8,100);

// Timezone Bar
function renderTzBar(){
  var html=timezones.map(function(tz){
    var time=new Date().toLocaleTimeString('en-US',{timeZone:tz.tz,hour12:false,hour:'2-digit',minute:'2-digit'});
    var hour=parseInt(time.split(':')[0]);
    var isWorking=hour>=9&&hour<17;
    return '<div class="tz-item"><span class="flag">'+tz.flag+'</span><div><div class="name">'+tz.name+'</div><div class="time">'+time+' ('+tz.hours+')</div></div><span class="status '+(isWorking?'working':'off')+'">'+(isWorking?'🟢 工作中':'⚫ 休息')+'</span></div>';
  }).join('');
  document.getElementById('tzBar').innerHTML=html;
}
renderTzBar();
setInterval(renderTzBar,60000);

// Contact List
function renderContacts(filter){
  var list=filter==='all'?contacts:filter==='scheduled'?contacts.filter(function(c){return c.s==='scheduled';}):contacts.filter(function(c){return c.p===filter;});
  var html=list.map(function(c){
    var initial=c.n.charAt(0);
    var statusClass=c.s==='sent'?'sent':c.s==='scheduled'?'scheduled':'pending';
    var statusText=c.s==='sent'?'✓ 已发送':c.s==='scheduled'?'⏰ 已排期':'⏳ 待发送';
    var time=c.t?c.t:c.tz?'📍 '+c.tz:'';
    return '<div class="contact-item"><div class="avatar">'+initial+'</div><div class="info"><div class="name">'+c.n+(c.tag?'<span class="tag">'+c.tag+'</span>':'')+'</div><div class="meta">'+c.c+' · '+c.r+'</div></div><div class="right"><div class="platform">'+c.p+'</div><div class="status '+statusClass+'">'+statusText+(c.t?' '+c.t:'')+'</div></div></div>';
  }).join('');
  document.getElementById('contactList').innerHTML=html;
}
renderContacts('all');

function filterBy(type){
  document.querySelectorAll('.filter-tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  renderContacts(type);
}

// Keywords
function renderKeywords(){
  var html=keywords.map(function(k){
    return '<div class="kw-tag" onclick="copyKw(\''+k.kw+'\')">'+k.kw+'<span class="score">'+k.score+'</span></div>';
  }).join('');
  document.getElementById('kwList').innerHTML=html;
}
renderKeywords();

function copyKw(kw){
  navigator.clipboard.writeText(kw);
  showToast('已复制: '+kw);
}

// Logs
function renderLogs(){
  var html=logs.map(function(l){
    return '<div class="log-item"><span class="time">'+l.t+'</span><span class="msg '+l.type+'">'+l.m+'</span></div>';
  }).join('');
  document.getElementById('logList').innerHTML=html;
}
renderLogs();

// Changelog
function renderChangelog(){
  var html=versions.map(function(v){
    var items=v.items.map(function(i){
      return '<li class="'+i.t+'">'+i.m+'</li>';
    }).join('');
    return '<div class="version-item expanded"><div class="version-header" onclick="toggleVersion(this)"><span class="v-num">v'+v.v+'</span><span class="v-date">'+v.d+'</span></div><div class="version-body"><ul>'+items+'</ul></div></div>';
  }).join('');
  document.getElementById('changelogList').innerHTML=html;
}
renderChangelog();

function toggleVersion(el){
  el.parentElement.classList.toggle('expanded');
}

// Panel Functions
function collapsePanel(btn){
  var panel=btn.closest('.panel');
  panel.classList.toggle('collapsed');
  btn.textContent=panel.classList.contains('collapsed')?'+':'−';
}

function resetPanel(btn){
  var panel=btn.closest('.panel');
  panel.style.width='';
  panel.style.height='';
  showToast('已重置面板尺寸');
}

// Drag & Drop
var panelsContainer=document.getElementById('panelsContainer');
var dragPanel=null;

panelsContainer.addEventListener('dragstart',function(e){
  if(e.target.classList.contains('panel')){
    dragPanel=e.target;
    e.target.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  }
});

panelsContainer.addEventListener('dragend',function(e){
  if(dragPanel){
    dragPanel.classList.remove('dragging');
    saveLayout();
    dragPanel=null;
  }
});

panelsContainer.addEventListener('dragover',function(e){
  e.preventDefault();
  if(!dragPanel)return;
  var after=getDragAfter(panelsContainer,e.clientY);
  if(after)panelsContainer.insertBefore(dragPanel,after);
  else panelsContainer.appendChild(dragPanel);
});

function getDragAfter(container,y){
  var els=[].filter.call(container.children,function(el){return el.classList.contains('panel')&&!el.classList.contains('dragging');});
  return els.reduce(function(closest,el){
    var box=el.getBoundingClientRect();
    var offset=y-box.top-box.height/2;
    if(offset<0&&offset>closest.offset)return{offset:offset,el:el};
    return closest;
  },{offset:Number.NEGATIVE_INFINITY}).el;
}

document.querySelectorAll('.panel').forEach(function(p){
  p.setAttribute('draggable','true');
});

// Resize
document.querySelectorAll('.resize-handle').forEach(function(handle){
  var isResizing=false;
  var startX,startY,startW,startH,panel;
  
  handle.addEventListener('mousedown',function(e){
    isResizing=true;
    panel=handle.closest('.panel');
    startX=e.clientX;
    startY=e.clientY;
    startW=panel.offsetWidth;
    startH=panel.offsetHeight;
    panel.classList.add('resizing');
    e.preventDefault();
  });
  
  document.addEventListener('mousemove',function(e){
    if(!isResizing)return;
    var w=startW+(e.clientX-startX);
    var h=startH+(e.clientY-startY);
    if(w>=300)panel.style.width=w+'px';
    if(h>=200)panel.style.height=h+'px';
  });
  
  document.addEventListener('mouseup',function(){
    if(isResizing){
      isResizing=false;
      panel.classList.remove('resizing');
      saveLayout();
    }
  });
});

// Save/Load Layout
function saveLayout(){
  var layout=[];
  document.querySelectorAll('.panel').forEach(function(p){
    layout.push({id:p.dataset.id,w:p.style.width,h:p.style.height});
  });
  localStorage.setItem('dashboardLayout',JSON.stringify(layout));
}

function loadLayout(){
  var saved=localStorage.getItem('dashboardLayout');
  if(!saved)return;
  var layout=JSON.parse(saved);
  layout.forEach(function(l){
    var panel=document.querySelector('[data-id="'+l.id+'"]');
    if(panel){
      if(l.w)panel.style.width=l.w;
      if(l.h)panel.style.height=l.h;
    }
  });
}
loadLayout();

// Toast
function showToast(msg){
  var toast=document.getElementById('toast');
  toast.textContent=msg;
  toast.className='toast show success';
  setTimeout(function(){toast.classList.remove('show');},2000);
}

// Init
showToast('拖拽面板头部移动位置，拖拽右下角调整大小');
</script>
